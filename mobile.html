<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Көршісін тап! — телефонға арналған ойын</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Times New Roman',serif;font-weight:900;background:#009af2}button{font:inherit;cursor:pointer}#game{width:min(100%,680px);min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#04a7ff,#38c6f6 49%,#65e51c 73%,#41c807);box-shadow:0 0 30px #003e6580;overflow:hidden}.title{width:100%;aspect-ratio:1024/175;background:url('title.png') center/100% 100% no-repeat}.stats{display:flex;align-items:stretch;justify-content:space-between;gap:10px;padding:0 3%}.stat{width:42%;border:3px solid #dc8500;border-radius:16px;background:linear-gradient(#fffce8,#ffe59a);box-shadow:0 4px 0 #9a5900;text-align:center;color:#153b93;padding:5px;font-size:clamp(17px,4.5vw,29px)}.stat strong{display:block;color:#bc1212;font-size:clamp(22px,6vw,36px)}.instruction{margin:14px 3% 6px;padding:9px 7px;border:3px solid #eeb10e;border-radius:28px;background:#fff9e9;color:#123b9e;text-align:center;font-size:clamp(19px,5vw,31px);box-shadow:0 4px 0 #b98617}.train-area{width:100%;position:relative;aspect-ratio:1024/465;background:url('train.png') center/100% 100% no-repeat;flex-shrink:0}.wagon{position:absolute;top:38%;height:28%;width:15.3%;border-radius:11px;border:2px dashed #b7763d;background:#fffaf0;color:#0d38bb;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,12vw,82px);line-height:1;z-index:2;padding:0}.wagon.blank{color:#c90e13}.wagon.target{outline:5px solid #ffec00;outline-offset:3px}.wagon:nth-child(1){left:36.6%}.wagon:nth-child(2){left:58.2%}.wagon:nth-child(3){left:79.1%}.play{flex:1;min-height:190px;background:linear-gradient(#60e51499,#36b90977),url('meadow_clean.jpg') center/cover no-repeat;padding:8px 4% 12px;display:flex;flex-direction:column;justify-content:center;gap:8px}.hint{color:#153886;background:#fffcebdc;border:2px solid #f3bd2c;border-radius:18px;text-align:center;padding:5px;font-size:clamp(17px,4.5vw,25px)}.answers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));justify-items:stretch;gap:12px;align-content:center}.answer{height:clamp(83px,19vw,120px);border:6px solid white;border-radius:23px;box-shadow:0 7px 0 #1a3d74,0 11px 13px #0005;color:white;text-shadow:2px 3px 2px #24345b;font-size:clamp(42px,12vw,80px);touch-action:none;user-select:none}.answer:nth-child(5n+1){background:linear-gradient(#34d0ff,#0665ef)}.answer:nth-child(5n+2){background:linear-gradient(#e99aff,#9925db)}.answer:nth-child(5n+3){background:linear-gradient(#8afc35,#00b52b)}.answer:nth-child(5n+4){background:linear-gradient(#ff94bd,#e82972)}.answer:nth-child(5n+5){background:linear-gradient(#45d2ff,#0863e8)}.answer:nth-child(1){grid-column:1/3}.answer:nth-child(2){grid-column:3/5}.answer:nth-child(3){grid-column:5/7}.answer:nth-child(4){grid-column:2/4;margin:0}.answer:nth-child(5){grid-column:4/6;margin:0}.answer.selected{outline:5px solid #ffef00}.answer.dragging{opacity:.9;z-index:9;position:relative;pointer-events:none}.feedback{min-height:32px;text-align:center;font-size:clamp(19px,5vw,30px);color:#b80912;text-shadow:1px 1px white}.footer{display:flex;gap:10px;justify-content:center;padding:0 12px 12px}.footer button,.modal button{background:#ffe594;border:3px solid #a85d0b;border-radius:14px;padding:8px 14px;font-size:clamp(17px,4vw,24px);color:#173e86}.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#043965c9;z-index:30;padding:18px}.modal.hidden{display:none}.dialog{width:min(95%,490px);background:#fff8d6;border:6px ridge #df990d;border-radius:26px;padding:25px 16px;text-align:center;box-shadow:0 12px 30px #0008}.dialog h2{font-size:clamp(30px,7vw,45px);color:#bc1717}.dialog p{font-size:clamp(23px,5vw,30px);color:#16458c}@media(min-width:700px){.stat{font-size:26px}.stat strong{font-size:35px}.instruction{font-size:29px}.wagon{font-size:78px}.answer{font-size:78px}.hint{font-size:25px}}@media(max-height:690px){.play{min-height:210px}.answer{height:75px}.instruction{margin-top:5px}.feedback{min-height:24px}}
@media(max-width:430px){.instruction{font-size:clamp(17px,4.7vw,23px);margin:8px 3% 5px;padding:7px 5px;line-height:1.15}.stats{gap:6px}.stat{font-size:clamp(15px,4vw,22px)}.stat strong{font-size:clamp(19px,5.5vw,29px)}.play{min-height:185px;padding:8px 4% 10px;gap:9px}.answers{gap:9px}.answer{height:clamp(65px,17vw,91px);font-size:clamp(36px,10vw,57px);border-width:4px}.feedback{min-height:25px;font-size:20px}}@media(max-height:680px) and (max-width:699px){.play{min-height:160px}.answer{height:65px}.instruction{margin-top:4px}}

/* Түзету: 7 мен 8 және қалған жауаптар бірдей өлшемде, суретте ескі сандар жоқ. */
.play{justify-content:center;gap:10px}
.answers{width:100%;align-items:stretch}
.answer{width:100%;min-width:0;min-height:0;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;line-height:1}
@media(max-width:430px){.answers{gap:10px}.answer{height:clamp(70px,19vw,90px);font-size:clamp(40px,11vw,60px);border-radius:17px}}
</style></head><body><main id="game"><div class="title" role="img" aria-label="Көршісін тап!"></div><div class="stats"><div class="stat">Тапсырма:<strong id="count">1 / 20</strong></div><div class="stat">⏱ Уақыт:<strong id="clock">00:00</strong></div></div><div class="instruction">Санды басып, бос вагонға орналастыр!</div><div class="train-area" id="train"><button class="wagon" id="wagon0" data-pos="0"></button><button class="wagon" id="wagon1" data-pos="1"></button><button class="wagon" id="wagon2" data-pos="2"></button></div><section class="play"><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div></section><footer class="footer"><button id="restart">↻ Қайта бастау</button></footer></main><div class="modal" id="modal"><div class="dialog"><h2 id="heading">🚂 Көршісін тап!</h2><p id="description">20 тапсырма. Сандардың көршісін тап!</p><button id="start">▶ Ойынды бастау</button></div></div><script>
(()=>{'use strict';const tasks=[[4,5,null],[null,8,null],[null,3,null],[null,6,null],[null,2,null],[7,8,null],[null,5,null],[null,4,null],[null,9,null],[null,6,7],[3,4,null],[null,9,10],[1,null,3],[null,4,null],[5,6,null],[null,2,null],[null,7,null],[null,5,null],[null,8,null],[null,3,null]];const $=id=>document.getElementById(id);let idx=0,filled=[],picked=null,busy=false,started=0,timer=null,audio=null,feedbackTimer=null,advanceTimer=null;const wagons=[0,1,2].map(i=>$('wagon'+i));function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function tick(){$('clock').textContent=fmt(Math.floor((Date.now()-started)/1000))}function tone(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();(ok?[523,659,784]:[240,170]).forEach((f,k)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+k*.12;o.type=ok?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.22)})}catch(e){}}function expected(pos){const row=tasks[idx],a=row.findIndex(v=>v!==null);return row[a]+pos-a}function choices(){const needed=[0,1,2].filter(p=>filled[p]===null).map(expected),set=new Set(needed);for(let d=1;set.size<5&&d<=11;d++)for(const n of [needed[0]-d,needed[0]+d,needed.at(-1)+d]){if(n>=0&&n<=10)set.add(n);if(set.size>=5)break}return [...set].slice(0,5).sort((a,b)=>a-b)}function message(s){$('feedback').textContent=s;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('feedback').textContent='',950)}function render(){busy=false;picked=null;filled=tasks[idx].slice();$('count').textContent=(idx+1)+' / 20';$('feedback').textContent='';wagons.forEach((w,p)=>{w.textContent=filled[p]===null?'?':filled[p];w.classList.toggle('blank',filled[p]===null);w.classList.remove('target')});$('answers').replaceChildren();choices().forEach(n=>{const b=document.createElement('button');b.className='answer';b.textContent=n;b.setAttribute('aria-label',n+' саны');let drag=null,suppress=false;b.addEventListener('click',()=>{if(suppress||busy)return;pick(n);const missing=filled.map((v,p)=>v===null?p:-1).filter(p=>p>=0);const dest=missing.find(p=>expected(p)===n);if(dest!==undefined)place(dest);else if(missing.length===1)place(missing[0]);else{tone(false);message('Қайта ойланып көр!')}});b.addEventListener('pointerdown',e=>{if(busy)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>9)drag.moved=true;if(drag.moved){b.classList.add('dragging');b.style.transform=`translate(${dx}px,${dy}px)`;wagons.forEach(w=>w.classList.toggle('target',hitWagon(e.clientX,e.clientY)===w))}});b.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;drag=null;const hit=hitWagon(e.clientX,e.clientY);b.style.transform='';b.classList.remove('dragging');wagons.forEach(w=>w.classList.remove('target'));if(moved){suppress=true;setTimeout(()=>suppress=false,150);if(hit){pick(n);place(Number(hit.dataset.pos))}}});b.addEventListener('pointercancel',()=>{drag=null;b.style.transform='';b.classList.remove('dragging')});$('answers').append(b)})}function hitWagon(x,y){return wagons.find(w=>{const r=w.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}function pick(n){picked=n;document.querySelectorAll('.answer').forEach(b=>b.classList.toggle('selected',Number(b.textContent)===n))}function place(pos){if(busy||filled[pos]!==null||picked===null)return;if(picked!==expected(pos)){tone(false);message('Қайта ойланып көр!');return}tone(true);filled[pos]=picked;wagons[pos].textContent=picked;wagons[pos].classList.remove('blank');picked=null;document.querySelectorAll('.answer').forEach(b=>b.classList.remove('selected'));message('Жарайсың! 🌟');if(filled.every(v=>v!==null)){busy=true;advanceTimer=setTimeout(()=>{idx++;if(idx===tasks.length){clearInterval(timer);$('heading').textContent='🏆 Жарайсың!';$('description').textContent='20 тапсырманы орындадың! Уақытың: '+fmt(Math.floor((Date.now()-started)/1000));$('start').textContent='↻ Қайта ойнау';$('modal').classList.remove('hidden')}else render()},900)}}wagons.forEach((w,p)=>w.addEventListener('click',()=>place(p)));function start(){clearInterval(timer);clearTimeout(advanceTimer);clearTimeout(feedbackTimer);idx=0;started=Date.now();$('modal').classList.add('hidden');timer=setInterval(tick,250);tick();render()}$('start').onclick=start;$('restart').onclick=()=>{clearInterval(timer);clearTimeout(advanceTimer);$('heading').textContent='🚂 Көршісін тап!';$('description').textContent='20 тапсырма. Сандардың көршісін тап!';$('start').textContent='▶ Ойынды бастау';$('modal').classList.remove('hidden')};render()})();
</script></body></html>
