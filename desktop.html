<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Көршісін тап! — 20 тапсырма</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#069df4;font-family:'Times New Roman',serif;font-weight:900;overflow:hidden}.screen{position:absolute;width:min(100vw,177.586vh);height:min(100vh,56.31vw);left:50%;top:50%;transform:translate(-50%,-50%);background:url('poiyz.png') center/100% 100% no-repeat;overflow:hidden}.cover{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#082c8b;font-weight:900}.wagon{top:39.3%;height:17.6%;width:14.0%;background:#fffefa;border:0;border-radius:10%;font-size:clamp(30px,7.5vw,115px);cursor:pointer;touch-action:manipulation;box-shadow:inset 0 0 6px #fff}#wagon0{left:34.25%}#wagon1{left:54.45%}#wagon2{left:73.85%}.wagon.blank{color:#c41111}.wagon.selected{outline:5px solid #f4d426}.answer{position:absolute;top:78.7%;height:14.3%;width:11.7%;border:0;border-radius:15%;font:900 clamp(28px,7vw,100px) 'Times New Roman',serif;color:#fff;text-shadow:2px 3px #102e80;cursor:grab;touch-action:none;box-shadow:inset 0 0 0 3px #ffffff70}.answer:nth-child(1){left:13.2%;background:linear-gradient(#2bb9ff,#0559d4)}.answer:nth-child(2){left:28.4%;background:linear-gradient(#d881fa,#9e1bd7)}.answer:nth-child(3){left:43.5%;background:linear-gradient(#85ed32,#10a51a)}.answer:nth-child(4){left:58.7%;background:linear-gradient(#ff83b4,#e92175)}.answer:nth-child(5){left:74%;background:linear-gradient(#2bb9ff,#0559d4)}.answer.picked{outline:6px solid #ffe600;outline-offset:2px}.count{left:4.5%;top:8.3%;width:10.5%;height:6.3%;background:#fff5b0;font-size:clamp(15px,3.7vw,57px);color:#bb0d0d}.clock{left:86.2%;top:9.1%;width:10.7%;height:5.7%;background:#fffefa;font-size:clamp(15px,3.6vw,57px);color:#bc1010}.notice{position:absolute;left:36%;top:58%;width:28%;padding:1%;background:#fff5b9;border:5px solid #1b9d27;border-radius:20px;color:#118327;font-size:clamp(25px,4.2vw,62px);text-align:center;opacity:0;pointer-events:none;z-index:4}.notice.show{animation:flash .85s ease}@keyframes flash{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}75%{opacity:1}100%{opacity:0}}.overlay{position:absolute;inset:0;background:#074a9eb9;display:flex;align-items:center;justify-content:center;z-index:10}.panel{background:linear-gradient(#fffac3,#ffce64);border:7px solid #de8e0a;border-radius:30px;padding:3%;width:65%;max-width:700px;text-align:center;box-shadow:0 10px 0 #9b4d11}.panel h1{font-size:clamp(32px,5vw,70px);color:#c20b0b;margin:0 0 12px}.panel p{font-size:clamp(23px,3vw,42px);color:#153b7a}.panel button{border:4px solid #0a5a26;border-radius:20px;background:#1eaa40;color:white;padding:12px 28px;font:900 clamp(25px,3vw,42px) 'Times New Roman',serif;cursor:pointer}.hidden{display:none}.instruction{position:absolute;left:20%;top:16.8%;width:61%;padding:.35% 1%;background:#fffce9;border:3px solid #e5a51b;border-radius:100px;color:#073b9d;text-align:center;font:900 clamp(14px,2.75vw,45px) "Times New Roman",serif;white-space:nowrap;z-index:2}.instruction strong{color:#d30b0b}.feedback{position:absolute;left:38%;top:69%;width:25%;text-align:center;color:#c51212;font-size:clamp(16px,2.5vw,35px);text-shadow:2px 2px white;opacity:0;pointer-events:none}.feedback.show{opacity:1}@media(max-width:650px){.wagon{font-size:8vw}.answer{font-size:8vw}.panel{width:85%}}

/* Дәл тураланған сан аймақтары */
.wagon{top:40.3%;height:18.0%;width:13.5%;border-radius:0;background:transparent;box-shadow:none;color:#0829b4;font-size:clamp(30px,7.4vw,115px);text-shadow:1px 2px #fff;z-index:2}
#wagon0{left:34.75%}#wagon1{left:54.85%}#wagon2{left:74.35%}
.wagon.blank{color:#bd1010}
.answer{top:76.6%;height:20.4%;width:12.6%;border:0;background:transparent!important;border-radius:0;box-shadow:none;color:#fff;font-size:clamp(35px,7.8vw,120px);text-shadow:2px 3px 2px #101a4c;z-index:3}
.answer:nth-child(1){left:13.45%}.answer:nth-child(2){left:28.45%}.answer:nth-child(3){left:43.65%}.answer:nth-child(4){left:58.45%}.answer:nth-child(5){left:73.95%}

.instruction{top:16.2%;left:20.5%;width:60%;font-size:clamp(13px,2.5vw,40px)}
@media(max-width:650px){.wagon{font-size:7vw}.answer{font-size:8vw}.clock{font-size:2.6vw}}

/* Тапсырма санын ықшамдау, секундомерді үлкейту */
.count{left:4.2%;top:8.2%;width:11.0%;height:5.0%;font-size:clamp(12px,2.55vw,42px);background:transparent}
.clock{left:86.4%;top:6.15%;width:10.1%;height:7.2%;font-size:clamp(15px,3.3vw,54px);background:transparent}
/* Санды қоршаған түрлі түсті төртбұрыш та бірге қозғалады */
.answer{top:76.3%;height:20.7%;width:13.25%;border-radius:17%;border:3px solid #fff;box-shadow:inset 0 0 0 4px #ffffff45,0 5px 0 #17305b;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:5}
.answer:nth-child(1){left:13.05%;background:linear-gradient(155deg,#35caff,#0764ec)!important}
.answer:nth-child(2){left:28.05%;background:linear-gradient(155deg,#e294ff,#9820df)!important}
.answer:nth-child(3){left:43.25%;background:linear-gradient(155deg,#8afc36,#00b32a)!important}
.answer:nth-child(4){left:58.05%;background:linear-gradient(155deg,#ff91bf,#ed2875)!important}
.answer:nth-child(5){left:73.55%;background:linear-gradient(155deg,#35caff,#0764ec)!important}
.answer.dragging{position:absolute;z-index:50;opacity:.94;cursor:grabbing;box-shadow:0 12px 22px #0007,inset 0 0 0 4px #ffffff65;pointer-events:none}

/* Бейненің өзінде салынған ескі 1/20 мен уақытты толық жабамыз. */
.count{left:4.35%;top:8.0%;width:10.1%;height:6.2%;background:#fff5a2;border-radius:5px;font-size:clamp(12px,2.45vw,40px);line-height:1;color:#b40d0d;white-space:nowrap;z-index:8;text-shadow:1px 1px #fff}
.clock{left:86.8%;top:6.9%;width:10.25%;height:7.15%;background:#fafaf8;border-radius:5px;font-size:clamp(13px,2.85vw,47px);line-height:1;color:#b40d0d;white-space:nowrap;z-index:8;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media(max-width:650px){.count{font-size:2.5vw}.clock{font-size:2.85vw}}
</style></head><body><main class="screen" id="screen"><div class="cover count" id="count">1 / 20</div><div class="cover clock" id="clock">00:00</div><div id="wagon0" class="cover wagon" data-pos="0"></div><div id="wagon1" class="cover wagon" data-pos="1"></div><div id="wagon2" class="cover wagon" data-pos="2"></div><div class="instruction">Санды басып, <strong>бос вагонға</strong> орналастыр!</div><div id="answers"></div><div id="notice" class="notice">Жарайсың! ⭐</div><div id="feedback" class="feedback">Қайта байқап көр!</div><div class="overlay" id="start"><div class="panel"><h1>🚂 Көршісін тап!</h1><p>Дұрыс сандарды таңда!</p><button id="startBtn">Ойынды бастау</button></div></div><div class="overlay hidden" id="finish"><div class="panel"><h1>Жарайсың! 🎉</h1><p>20 тапсырманы орындадың!</p><p>⏱ Уақытың: <span id="result">00:00</span></p><button id="again">Қайта ойнау</button></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const tasks=[[4,5,null],[null,8,null],[null,3,null],[null,6,null],[null,2,null],[7,8,null],[null,5,null],[null,4,null],[null,9,null],[null,6,7],[3,4,null],[null,9,10],[1,null,3],[null,4,null],[5,6,null],[null,2,null],[null,7,null],[null,5,null],[null,8,null],[null,3,null]];let i=0,filled=[],picked=null,lock=false,startAt=0,timer=null,audio=null,feedbackTimer=null;const wagons=[0,1,2].map(x=>$('wagon'+x));function sound(ok){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;const notes=ok?[523.25,659.25,783.99]:[250,180];notes.forEach((freq,k)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(freq,t+k*(ok?.11:.14));g.gain.setValueAtTime(0.0001,t+k*(ok?.11:.14));g.gain.exponentialRampToValueAtTime(.18,t+k*(ok?.11:.14)+.012);g.gain.exponentialRampToValueAtTime(.0001,t+k*(ok?.11:.14)+.17);o.connect(g).connect(audio.destination);o.start(t+k*(ok?.11:.14));o.stop(t+k*(ok?.11:.14)+.19)})}catch(e){}}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function tick(){$('clock').textContent=fmt(Math.floor((Date.now()-startAt)/1000))}function expected(pos){const row=tasks[i];const anchor=row.findIndex(v=>v!==null);return row[anchor]+pos-anchor}function choices(){const need=[0,1,2].filter(p=>tasks[i][p]===null).map(expected);const set=new Set(need);for(let delta=1;set.size<5&&delta<=10;delta++){for(const v of [need[0]-delta,need[need.length-1]+delta,need[0]+delta]){if(v>=0&&v<=10)set.add(v);if(set.size>=5)break}}return [...set].slice(0,5).sort((a,b)=>a-b)}function render(){lock=false;picked=null;filled=tasks[i].slice();$('count').textContent=(i+1)+' / 20';wagons.forEach((w,p)=>{w.textContent=filled[p]===null?'?':filled[p];w.classList.toggle('blank',filled[p]===null);w.classList.remove('selected')});$('answers').innerHTML='';choices().forEach((n,k)=>{const b=document.createElement('button');b.className='answer';b.textContent=n;b.draggable=false;b.addEventListener('click',()=>{if(lock||suppressClick)return;picked=n;document.querySelectorAll('.answer').forEach(x=>x.classList.toggle('picked',Number(x.textContent)===n));const missing=filled.map((v,p)=>v===null?p:-1).filter(v=>v>=0);{const destination=missing.find(pos=>expected(pos)===n);if(destination!==undefined)place(destination);else if(missing.length===1)place(missing[0]);else {sound(false);const f=$('feedback');f.classList.add('show');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>f.classList.remove('show'),650)}}});let drag=null,suppressClick=false;
b.addEventListener('pointerdown',e=>{if(lock)return;picked=n;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};b.setPointerCapture(e.pointerId)});
b.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){b.classList.add('dragging');b.style.transform=`translate(${dx}px,${dy}px)`;wagons.forEach(w=>w.classList.remove('drop-target'));const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.wagon');if(hit)hit.classList.add('drop-target')}});
b.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;drag=null;wagons.forEach(w=>w.classList.remove('drop-target'));if(moved){const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('.wagon');b.style.transform='';b.classList.remove('dragging');suppressClick=true;setTimeout(()=>suppressClick=false,100);if(hit){picked=n;place(Number(hit.dataset.pos))}}});
b.addEventListener('pointercancel',()=>{drag=null;b.style.transform='';b.classList.remove('dragging');wagons.forEach(w=>w.classList.remove('drop-target'))});
$('answers').append(b)})}function place(pos){if(lock||filled[pos]!==null||picked===null)return;if(picked!==expected(pos)){sound(false);const f=$('feedback');f.classList.add('show');clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>f.classList.remove('show'),650);return}sound(true);filled[pos]=picked;wagons[pos].textContent=picked;wagons[pos].classList.remove('blank');picked=null;document.querySelectorAll('.answer').forEach(b=>b.classList.remove('picked'));if(filled.every(v=>v!==null)){lock=true;const msg=$('notice');msg.classList.remove('show');void msg.offsetWidth;msg.classList.add('show');setTimeout(()=>{i++;if(i===tasks.length){clearInterval(timer);$('result').textContent=fmt(Math.floor((Date.now()-startAt)/1000));$('finish').classList.remove('hidden')}else render()},950)}}wagons.forEach((w,pos)=>{w.addEventListener('click',()=>place(pos));w.addEventListener('dragover',e=>e.preventDefault());w.addEventListener('drop',e=>{e.preventDefault();const n=Number(e.dataTransfer.getData('text/plain'));if(Number.isFinite(n))picked=n;place(pos)})});function start(){i=0;startAt=Date.now();clearInterval(timer);timer=setInterval(tick,250);tick();$('start').classList.add('hidden');$('finish').classList.add('hidden');render()}$('startBtn').onclick=start;$('again').onclick=start;})();
</script></body></html>
