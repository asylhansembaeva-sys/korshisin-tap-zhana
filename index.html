<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Көршісін тап!</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#009af2}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" title="Көршісін тап!" allow="autoplay"></iframe><script>(function(){const frame=document.getElementById('game');let mode='';function update(){const mobile=window.innerWidth<700&&window.innerHeight>window.innerWidth;const next=mobile?'mobile.html':'desktop.html';if(mode!==next){mode=next;frame.src=next}}window.addEventListener('resize',update);update()})();</script></body></html>
